<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Architect – Build ATS-Ready Resumes with AI</title>
    <meta name="description" content="Craft a professional, ATS-optimized resume in minutes using the power of Google Gemini AI. Choose from 9 premium templates, get an ATS audit score, and export a clean PDF.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:wght@400;700&family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ─── Design Token System ───────────────────────────────────────────── */
        :root {
            /* Light mode */
            --background:    240 10% 97%;
            --foreground:    240 15% 12%;
            --card:          0 0% 100%;
            --card-foreground: 240 15% 12%;

            /* Indigo primary */
            --primary:       243 75% 59%;
            --primary-foreground: 0 0% 100%;

            /* Amber AI accent (custom property, not overriding secondary) */
            --ai-accent:     38 92% 50%;
            --ai-accent-fg:  30 15% 10%;

            --secondary:     240 10% 94%;
            --secondary-foreground: 240 15% 20%;
            --muted:         240 8% 94%;
            --muted-foreground: 240 8% 46%;
            --accent:        240 10% 93%;
            --accent-foreground: 240 15% 20%;
            --destructive:   0 84% 60%;
            --destructive-foreground: 0 0% 100%;
            --border:        240 10% 88%;
            --input:         240 10% 91%;
            --ring:          243 75% 59%;
        }

        .dark {
            /* Deep space dark mode */
            --background:    240 14% 7%;
            --foreground:    240 10% 94%;
            --card:          240 13% 10%;
            --card-foreground: 240 10% 92%;

            /* Indigo primary stays vivid in dark */
            --primary:       243 75% 62%;
            --primary-foreground: 0 0% 100%;

            --ai-accent:     38 92% 52%;
            --ai-accent-fg:  30 15% 10%;

            --secondary:     240 12% 16%;
            --secondary-foreground: 240 10% 90%;
            --muted:         240 12% 14%;
            --muted-foreground: 240 8% 58%;
            --accent:        240 12% 16%;
            --accent-foreground: 240 10% 90%;
            --destructive:   0 63% 42%;
            --destructive-foreground: 0 0% 100%;
            --border:        240 12% 18%;
            --input:         240 12% 15%;
            --ring:          243 75% 62%;
        }

        /* ─── Base ──────────────────────────────────────────────────────────── */
        * { box-sizing: border-box; }

        body {
            font-family: 'Geist', system-ui, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            /* Subtle noise-like dot grid, much smaller than before */
            background-image: radial-gradient(hsl(var(--muted-foreground) / 0.08) 0.5px, transparent 0);
            background-size: 18px 18px;
        }

        /* ─── Custom properties exposed to Tailwind-like utilities ─────────── */
        .font-display {
            font-family: 'Outfit', system-ui, sans-serif;
            letter-spacing: -0.01em;
        }

        /* ─── Scrollbar ─────────────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: hsl(var(--muted-foreground) / 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: hsl(var(--primary) / 0.5);
        }

        /* ─── Keyframes ─────────────────────────────────────────────────────── */
        @keyframes float-up {
            0%   { transform: translateY(12px); opacity: 0; }
            100% { transform: translateY(0);    opacity: 1; }
        }
        @keyframes orb-drift {
            0%,100% { transform: translate(0, 0)   scale(1); }
            33%      { transform: translate(30px, -20px) scale(1.05); }
            66%      { transform: translate(-20px, 15px) scale(0.97); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position:  200% center; }
        }
        @keyframes pulse-ring {
            0%   { transform: scale(0.95); opacity: 0.5; }
            50%  { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        @keyframes slide-down {
            0%   { opacity: 0; transform: translateY(-8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes reveal-up {
            0%   { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes reveal-left {
            0%   { opacity: 0; transform: translateX(-24px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes reveal-right {
            0%   { opacity: 0; transform: translateX(24px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes scale-in {
            0%   { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes counter-tick {
            0%   { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ─── Utility classes ───────────────────────────────────────────────── */
        .animate-float-up   { animation: float-up  0.7s cubic-bezier(0.22,1,0.36,1) both; }
        .animate-orb-drift  { animation: orb-drift 14s ease-in-out infinite; }
        .animate-pulse-ring { animation: pulse-ring 2.4s infinite ease-in-out; }
        .animate-slide-down { animation: slide-down 0.22s cubic-bezier(0.22,1,0.36,1) both; }
        .animate-reveal-up  { animation: reveal-up 0.65s cubic-bezier(0.22,1,0.36,1) both; }
        .animate-reveal-left { animation: reveal-left 0.65s cubic-bezier(0.22,1,0.36,1) both; }
        .animate-reveal-right { animation: reveal-right 0.65s cubic-bezier(0.22,1,0.36,1) both; }
        .animate-scale-in   { animation: scale-in 0.5s cubic-bezier(0.22,1,0.36,1) both; }

        /* Staggered delays for sequential reveal */
        .delay-100 { animation-delay: 0.1s; }
        .delay-150 { animation-delay: 0.15s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .delay-700 { animation-delay: 0.7s; }

        /* Intersection-observer reveal helper */
        .reveal-hidden {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
        }
        .reveal-hidden.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-hidden.delay-100 { transition-delay: 0.1s; }
        .reveal-hidden.delay-200 { transition-delay: 0.2s; }
        .reveal-hidden.delay-300 { transition-delay: 0.3s; }
        .reveal-hidden.delay-400 { transition-delay: 0.4s; }
        .reveal-hidden.delay-500 { transition-delay: 0.5s; }

        .text-shimmer {
            background: linear-gradient(90deg,
                hsl(var(--primary)) 0%,
                hsl(var(--ai-accent)) 45%,
                hsl(var(--primary)) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        /* AI action buttons — amber glow */
        .btn-ai {
            background: linear-gradient(135deg, hsl(var(--ai-accent)), hsl(38 92% 42%));
            color: hsl(var(--ai-accent-fg));
            border: none;
            box-shadow: 0 0 0 0 hsl(var(--ai-accent) / 0);
            transition: box-shadow 0.25s, transform 0.15s;
        }
        .btn-ai:hover {
            box-shadow: 0 0 24px 4px hsl(var(--ai-accent) / 0.35);
            transform: translateY(-1px);
        }
        .btn-ai:active { transform: translateY(0); }
        .btn-ai:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ai-accent));
        }

        /* Primary action buttons — pure indigo */
        .btn-primary-glow {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            box-shadow: 0 4px 20px -4px hsl(var(--primary) / 0.45),
                        inset 0 1px 0 rgba(255,255,255,0.15);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }
        .btn-primary-glow:hover {
            box-shadow: 0 8px 28px -4px hsl(var(--primary) / 0.6),
                        inset 0 1px 0 rgba(255,255,255,0.2);
            transform: translateY(-1.5px);
            background: hsl(var(--primary) / 0.92);
        }
        .btn-primary-glow:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-primary-glow:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--primary));
        }

        /* True Glassmorphism with edge refraction and inner border */
        .glass-card {
            background: hsl(var(--card) / 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid hsl(var(--border) / 0.35);
            box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.06), 
                        0 10px 30px -10px rgba(0, 0, 0, 0.12);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Fixed noise grain overlay for tactile texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0.018;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* macOS-style browser frame controls */
        .window-chrome {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: hsl(var(--muted) / 0.6);
            border-bottom: 1px solid hsl(var(--border) / 0.4);
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }

        .window-dot {
            width: 9px;
            height: 9px;
            border-radius: 9999px;
        }

        /* Template preview hover glass overlay */
        .preview-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 30;
            pointer-events: none;
        }

        .group:hover .preview-hover-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Spotlight Border / Card effect */
        .spotlight-card {
            position: relative;
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border) / 0.6);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .spotlight-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: radial-gradient(800px circle at var(--mouse-x, 0) var(--mouse-y, 0), hsl(var(--primary) / 0.15), transparent 40%);
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .spotlight-card:hover::before {
            opacity: 1;
        }

        .spotlight-card > * {
            position: relative;
            z-index: 1;
        }

        /* ─── Builder-specific resume preview scaling ───────────────────────── */
        #resume-preview-content {
            --font-scale: 1;
            --lh-scale:   1;
        }
        #resume-preview-content.scale-small { --font-scale: 0.85; --lh-scale: 0.85; }
        #resume-preview-content.scale-large { --font-scale: 1.15; --lh-scale: 1.15; }

        #resume-preview-content .text-\[9px\]  { font-size: calc(9px   * var(--font-scale)) !important; }
        #resume-preview-content .text-\[10px\] { font-size: calc(10px  * var(--font-scale)) !important; }
        #resume-preview-content .text-\[10pt\] { font-size: calc(10pt  * var(--font-scale)) !important; }
        #resume-preview-content .text-xs   { font-size: calc(0.75rem  * var(--font-scale)) !important; }
        #resume-preview-content .text-sm   { font-size: calc(0.875rem * var(--font-scale)) !important; }
        #resume-preview-content .text-base { font-size: calc(1rem     * var(--font-scale)) !important; }
        #resume-preview-content .text-lg   { font-size: calc(1.125rem * var(--font-scale)) !important; }
        #resume-preview-content .text-xl   { font-size: calc(1.25rem  * var(--font-scale)) !important; }
        #resume-preview-content .text-2xl  { font-size: calc(1.5rem   * var(--font-scale)) !important; }
        #resume-preview-content .text-3xl  { font-size: calc(1.875rem * var(--font-scale)) !important; }

        #resume-preview-content .leading-none    { line-height: calc(1      * var(--lh-scale)) !important; }
        #resume-preview-content .leading-tight   { line-height: calc(1.25   * var(--lh-scale)) !important; }
        #resume-preview-content .leading-snug    { line-height: calc(1.375  * var(--lh-scale)) !important; }
        #resume-preview-content .leading-normal  { line-height: calc(1.5    * var(--lh-scale)) !important; }
        #resume-preview-content .leading-relaxed { line-height: calc(1.625  * var(--lh-scale)) !important; }

        /* Margin overrides */
        #resume-preview-content.margins-narrow .p-8,
        #resume-preview-content.margins-narrow .p-6 { padding: 1.25rem !important; }
        #resume-preview-content.margins-wide   .p-8,
        #resume-preview-content.margins-wide   .p-6 { padding: 3.25rem !important; }

        #resume-preview-content.margins-narrow .mb-6 { margin-bottom: 0.75rem  !important; }
        #resume-preview-content.margins-narrow .mb-4 { margin-bottom: 0.5rem   !important; }
        #resume-preview-content.margins-narrow .mb-3 { margin-bottom: 0.35rem  !important; }
        #resume-preview-content.margins-narrow .mb-2 { margin-bottom: 0.25rem  !important; }
        #resume-preview-content.margins-narrow .gap-6 { gap: 0.75rem  !important; }
        #resume-preview-content.margins-narrow .gap-3 { gap: 0.35rem  !important; }
        #resume-preview-content.margins-wide   .mb-6 { margin-bottom: 2rem    !important; }
        #resume-preview-content.margins-wide   .mb-4 { margin-bottom: 1.5rem  !important; }
        #resume-preview-content.margins-wide   .gap-6 { gap: 2rem     !important; }

        /* ─── Hero gradient orb (signature element) ─────────────────────────── */
        .hero-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(80px);
            pointer-events: none;
        }
        .hero-orb-1 {
            width: 520px; height: 520px;
            background: hsl(var(--primary) / 0.18);
            top: -120px; right: -120px;
        }
        .hero-orb-2 {
            width: 340px; height: 340px;
            background: hsl(var(--ai-accent) / 0.12);
            bottom: 40px; left: -60px;
        }
    </style>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans:    ['Geist', 'system-ui', 'sans-serif'],
              display: ['Outfit', 'system-ui', 'sans-serif'],
            },
            colors: {
              border:     'hsl(var(--border))',
              input:      'hsl(var(--input))',
              ring:       'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT:    'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT:    'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              destructive: {
                DEFAULT:    'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              muted: {
                DEFAULT:    'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT:    'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              card: {
                DEFAULT:    'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg: '0.625rem',
              md: '0.5rem',
              sm: '0.375rem',
              xl: '0.875rem',
              '2xl': '1.25rem',
            },
            boxShadow: {
              'glow-primary': '0 0 24px 4px hsl(var(--primary) / 0.25)',
              'glow-ai':      '0 0 24px 4px hsl(var(--ai-accent) / 0.3)',
            },
          }
        }
      }
    </script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-router-dom": "https://esm.sh/react-router-dom@6.24.0?external=react",
    "@google/genai": "https://aistudiocdn.com/@google/genai@1.29.0",
    "jspdf": "https://aistudiocdn.com/jspdf@3.0.3",
    "html2canvas": "https://aistudiocdn.com/html2canvas@1.4.1",
    "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react",
    "@radix-ui/react-slot": "https://esm.sh/@radix-ui/react-slot@1.1.0?external=react",
    "class-variance-authority": "https://aistudiocdn.com/class-variance-authority@0.7.1",
    "@radix-ui/react-accordion": "https://esm.sh/@radix-ui/react-accordion@1.2.0?external=react",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>

</head>
<body class="bg-background text-foreground relative">
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
